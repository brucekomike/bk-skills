name: bundle-skills

# Rolling channel, not versioned releases. Every push to main (or a manual run)
# rebuilds the bundle and re-uploads it to the single `latest` release, so there
# is no version to bump and no tag to cut. Traceability lives in
# bundle-metadata.txt: the resolved commit of every skill, this repo's commit and
# the build time.
#
#   push main / workflow_dispatch -> build, verify, install, then re-upload
#   pull_request / nightly        -> build and verify only, publish nothing
#
# CI stays a thin wrapper around scripts/build-bundle.sh so a published bundle is
# never produced by a path that was not exercised locally. The nightly run matters
# because the manifest tracks branches: a broken skill repo should surface here,
# not at someone's install.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the bundle
        id: build
        run: |
          set -euo pipefail
          # tee would hide a build failure behind the pipeline's exit code.
          bash scripts/build-bundle.sh | tee build.log
          tarball=$(tail -1 build.log)
          echo "tarball=$(basename "$tarball")" >> "$GITHUB_OUTPUT"

      - name: Verify the bundle against the manifest
        run: |
          set -euo pipefail
          t="dist/${{ steps.build.outputs.tarball }}"
          test -f "$t"
          test -f "$t.sha256"
          test -f dist/bundle-metadata.txt

          rm -rf unpack && mkdir unpack && tar -xzf "$t" -C unpack
          # The tree lives INSIDE unpack/; naming it without that prefix made
          # every path below resolve against the workspace and fail silently,
          # because a bare `test -f` prints nothing under `bash -e`.
          root="unpack/$(ls unpack)"
          [ -d "$root" ] || { echo "unexpected bundle layout: no $root/"; exit 1; }

          for f in skill-config/loader.sh skill-config/loader.sha256 bundle-metadata.txt; do
            test -f "$root/$f" || { echo "bundle is missing $f"; exit 1; }
          done
          ( cd "$root" && sha256sum -c skill-config/loader.sha256 )

          n=0
          while IFS=$'\t' read -r name url ref; do
            case "$name" in ''|\#*) continue ;; esac
            awk -F'\t' -v want="$name" '$1=="skill" && $2==want {found=1} END{exit !found}' \
              "$root/bundle-metadata.txt" || { echo "metadata has no entry for $name"; exit 1; }
            n=$((n+1))
          done < manifest.tsv
          [ "$n" -gt 0 ] || { echo "manifest selected nothing"; exit 1; }
          grep -qE '^commit	[0-9a-f]{40}$' "$root/bundle-metadata.txt" \
            || { echo "metadata has no resolved 40-char commit"; exit 1; }
          echo "verified $n manifest entries"

          found=0
          shopt -s nullglob
          for d in "$root"/skills/*/; do
            test -f "$d/SKILL.md" || { echo "skill dir with no SKILL.md: $d"; exit 1; }
            found=$((found+1))
          done
          [ "$found" -gt 0 ] || { echo "bundle contains no skills"; exit 1; }
          echo "bundle holds $found skills"

      - name: Prove the bundle actually installs
        run: |
          set -euo pipefail
          bash scripts/install-bundle.sh "dist/${{ steps.build.outputs.tarball }}"
          test -f "$HOME/.config/skill-config/loader.sh" || {
            echo "install-bundle did not place the loader"; exit 1; }
          # Re-running must be a no-op rather than a corruption.
          bash scripts/install-bundle.sh "dist/${{ steps.build.outputs.tarball }}" >/dev/null
          test -f "$HOME/.config/skill-config/loader.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/bundle-metadata.txt
            build.log
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: artifact

      - name: Re-upload to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # download-artifact@v4 replays the upload's directory names, so locate
          # the files rather than assuming the layout.
          asset=$(find artifact -name '*.tar.gz' -print -quit)
          [ -n "$asset" ] || { echo "no bundle tarball in the artifact"; exit 1; }
          dir=$(dirname "$asset")
          digest="$dir/$(basename "$asset").sha256"
          meta="$dir/bundle-metadata.txt"

          # Verify the digest belongs to this asset before it goes anywhere.
          ( cd "$dir" && sha256sum -c "$(basename "$digest")" )

          notes="Rolling bundle — rebuilt on every push to main."$'\n\n'
          if [ -f "$meta" ]; then
            notes+="Bundled skills, resolved at build time:"$'\n\n'
            notes+=$(awk -F'\t' '
              /^skill\t/  { s=$2 }
              /^ref\t/    { r=$2 }
              /^commit\t/ { printf "- %s @ %s (%s)\n", s, r, substr($2,1,8) }
            ' "$meta")
            notes+=$'\n\n'"Built $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA:0:8}."
          fi

          args=("$asset" "$digest")
          [ -f "$meta" ] && args+=("$meta")

          # Create once, then replace assets in place. The tag is never moved and
          # the release is never deleted, so a download in flight cannot 404 and
          # nothing needs a force-push; the metadata records the real build commit.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${args[@]}" --clobber
            gh release edit latest --title "bk-skills (rolling)" --notes "$notes"
            echo "re-uploaded to the existing rolling release"
          else
            gh release create latest "${args[@]}" \
              --target "$GITHUB_SHA" --title "bk-skills (rolling)" --notes "$notes"
            echo "created the rolling release"
          fi
          gh release view latest --json assets --jq '.assets[].name'
